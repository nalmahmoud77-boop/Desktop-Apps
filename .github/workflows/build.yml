name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MediVault
            solution: MediVault/MediVault.sln
          - name: AgileFlow
            solution: AgileFlow/AgileFlow.sln
          - name: StoreApp
            solution: StoreApp/StoreApp.sln

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --configuration Release --no-restore /warnaserror
